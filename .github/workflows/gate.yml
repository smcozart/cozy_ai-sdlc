# Required check: blocks merge when red (#33; ADR 0005).
name: gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]  # edited: a fixed PR body re-runs pr-adr-line
  push:
    branches: [main]  # #181: prove main after every merge
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the hold and the range check diff the range
      - name: tests/validate.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json body -q .body > "$RUNNER_TEMP/pr-body.md"
            bash tests/validate.sh "origin/${{ github.base_ref }}..HEAD" "$RUNNER_TEMP/pr-body.md"
          else
            bash tests/validate.sh  # push to main: HEAD~1..HEAD, the merge; pr-adr-line skips (no PR body)
          fi
  # #159: the scaffolded project's gate on every OS. Mirrors new-project Move 3 (scaffold, add, commit) and its
  # clone check; windows-latest runs Git Bash with core.autocrlf=true and no symlinks, as a developer's machine does.
  template:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: scaffold, commit, clone
        run: |
          p="$RUNNER_TEMP/p"; git init -q -b main "$p"; cd "$p"
          bash "$GITHUB_WORKSPACE/plugin/templates/new-project/scaffold.sh" . --owner demo --name demo | tee "$RUNNER_TEMP/out"
          git add -- $(sed -nE 's/^(wrote|appended): //p' "$RUNNER_TEMP/out")
          ! grep -qx 'wrote: tests/validate.sh' "$RUNNER_TEMP/out" || git add --chmod=+x -- tests/validate.sh
          git -c user.name=ci -c user.email=ci@localhost -c commit.gpgsign=false commit -qm scaffold
          git clone -q "$p" "$RUNNER_TEMP/c"
      - name: LF checkout, executable gate
        working-directory: ${{ runner.temp }}/c
        run: |
          git config --get core.autocrlf || true
          if git ls-files --eol | grep 'w/crlf'; then exit 1; fi   # `! pipeline` is ignored by bash -e: an if fails the step
          [ "$(git ls-files -s tests/validate.sh | cut -c1-6)" = 100755 ]
      - name: gate
        working-directory: ${{ runner.temp }}/c
        run: bash tests/validate.sh
      - name: witness
        working-directory: ${{ runner.temp }}/c
        run: |
          bash tests/validate.sh --witness | tee "$RUNNER_TEMP/w"
          # the symlink row runs where the OS has symlinks; only Windows may skip it
          row='app-tests @symlink under intent/'
          if [ "$RUNNER_OS" = Windows ]; then grep -qE "^witness (ok|skipped): $row" "$RUNNER_TEMP/w"
          else grep -q "^witness ok: $row" "$RUNNER_TEMP/w"; fi
